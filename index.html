<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffd700">
  <title>Titanic Master Shipbuilder</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header>
      <h1>Titanic Master Shipbuilder</h1>
      <div class="stats">
        <div id="score">Score: 0</div>
        <div id="accuracy">Accuracy: 0%</div>
      </div>
    </header>

    <main>
      <div id="shipyard">
        <div id="ship-view">
          <!-- Ghost outlines + placed pieces rendered here -->
        </div>
        <div id="pieces-panel">
          <!-- Unplaced pieces rendered here -->
        </div>
      </div>
    </main>

    <footer>
      <div id="progress">Progress: 0/12 pieces placed</div>
      <nav id="bottom-nav">
        <button id="rotate-btn" type="button">Rotate</button>
        <button id="reset-btn" type="button">Reset</button>
      </nav>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(() => console.log('SW registered'))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
